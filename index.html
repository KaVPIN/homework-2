<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="card">
    <h1 id="event-title">Ночь в музее</h1>
    <p class="event-date">15 ноября, 18:30</p>
    <p class="event-place">Музей космонавтики, проспект Мира, 111</p>
    <p class="event-description">Вечерняя программа с выставкой и экскурсиями</p>
    <button id="show-program" type="button">Показать программу</button>
    <div id="program" hidden></div>
  </article>

  <form id="service-form" class="service-form" hidden>
    <p class="form-title">Дополнительные услуги</p>
    <label><input type="checkbox" id="guide" name="guide"> Экскурсия с гидом (500 руб.)</label>
    <label><input type="checkbox" id="audio" name="audio"> Аудиогид (350 руб.)</label>
    <label><input type="checkbox" id="catalog" name="catalog"> Каталог выставки (250 руб.)</label>
    <button type="submit">Рассчитать</button>
  </form>

  <div id="choice-error" class="error" hidden>Выберите хотя бы одну услугу.</div>
  <div id="data-error" class="error" hidden>Ошибка данных.</div>

  <div id="result" class="result" hidden></div>
  <div id="report-json" class="report-json" hidden></div>

  <script src="app.js"></script>
</body>
</html>
